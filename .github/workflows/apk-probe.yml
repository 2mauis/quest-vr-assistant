# Build the native workspace and its bounded diagnostic component from source.
# CI creates a temporary signing key; no headset key or Tunnel credential is used.

name: quest-apk

on:
  push:
    paths:
      - "apps/quest-app/**"
      - ".github/workflows/apk-probe.yml"
  pull_request:
    paths:
      - "apps/quest-app/**"
      - ".github/workflows/apk-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Quest Assistant ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Health and web policy checks
        run: python3 apps/quest-app/tunnel-probe/test.py

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android platform and build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/core-lambda-stubs.jar"

      - name: Setup Go 1.27.3
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Checkout pinned cloudflared
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cloudflare/cloudflared
          ref: 872b241f94871665c1c157adefcf90c11f0ead96
          path: apps/quest-app/tunnel-probe/build/cloudflared-source
          persist-credentials: false

      - name: Verify cloudflared source
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/apps/quest-app/tunnel-probe/build/cloudflared-source"
          test "$(git -C "$dest" rev-parse HEAD)" = "872b241f94871665c1c157adefcf90c11f0ead96"
          test -z "$(git -C "$dest" status --porcelain)"
          echo "QVR_CLOUDFLARED_SOURCE_DIR=$dest" >> "$GITHUB_ENV"

      - name: Build probe APK
        run: python3 apps/quest-app/tunnel-probe/build.py

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: "8.14.3"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build native workspace and check display protocol
        env:
          QVR_WEB_START_URL: ${{ secrets.QVR_WEB_START_URL || 'https://app.example.com/' }}
        run: |
          gradle --no-daemon --console=plain -p apps/quest-app/spatial :core:test :app:assembleDebug

      - name: Verify and prepare native APK
        env:
          QVR_WEB_START_URL: ${{ secrets.QVR_WEB_START_URL || 'https://app.example.com/' }}
        run: python3 apps/quest-app/spatial/verify-apk.py --commit "$GITHUB_SHA"

      - name: Upload native APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest-assistant-arm64-${{ github.sha }}
          path: apps/quest-app/spatial/build/artifact/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload probe APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest-tunnel-probe
          path: |
            apps/quest-app/tunnel-probe/build/quest-tunnel-probe.apk
            apps/quest-app/tunnel-probe/build/build-result.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload display test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-display-test-reports
          path: |
            apps/quest-app/spatial/core/build/test-results/test/
            apps/quest-app/spatial/core/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore
