name: ci

on:
  push:
    branches:
      - "refactor/**"
    paths:
      - "apps/web-display/**"
      - "services/**"
      - "shared/**"
      - "scripts/**"
      - "test/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - "playwright.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Relay unit and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Browser tests
        run: npm run test:e2e -- --reporter=list,html
      - name: MCP delivered check
        run: npm run check:delivered
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
